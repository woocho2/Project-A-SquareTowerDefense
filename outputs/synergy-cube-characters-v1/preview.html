<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>정사각형 시너지 캐릭터와 굴림 보스</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:26px;background:#19212c;color:#edf1f7;font:16px system-ui,sans-serif}h1{font-size:25px}h2{margin-top:36px;font-size:20px}p{color:#bac9d5}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;max-width:1120px}.card{background:#263848;border-radius:8px;text-align:center;padding:12px}.tile{width:170px;height:170px;position:relative;margin:auto}.tile img{position:absolute;inset:0;width:100%;height:100%}.card strong{display:block;margin-top:12px}.card small{color:#a7bccb}.controls{display:flex;gap:15px;align-items:center;flex-wrap:wrap}button,select{padding:10px 15px;border:0;border-radius:6px;font:inherit;background:#d9b451;color:#15202b}select{background:#31465a;color:#edf1f7}canvas{display:block;background:#263848;border-radius:10px;margin-top:20px;max-width:100%}.faces{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.faces img{width:110px;height:110px}.faces div{background:#263848;padding:8px;text-align:center}.faces small{display:block}
img[src*='Front'],.pose img,.faces img{clip-path:inset(6.25% round 3.125%)}
</style>
<h1>정사각형 머리 · 시너지 타워</h1>
<p>머리 자체가 네모난 카툰 SD 캐릭터입니다. 시너지 타워는 스폰 타일 크기에 맞춰 정면으로 고정합니다.</p>
<div class="gallery" id="gallery"></div>
<h2>보스 · 여섯 면으로 굴림</h2>
<div class="controls"><select id="boss"></select><button id="play">굴려 보기</button><button id="reset">처음으로</button><label>이동 속도 <input type="range" id="speed" min="0.5" max="5" step="0.25" value="3"><output id="speed-label">3</output></label><label>순간 보기 <input type="range" id="progress" min="0" max="1" step="0.01" value="0"></label></div>
<p id="status">이미지를 불러오는 중…</p>
<canvas id="board" width="440" height="470"></canvas><div class="faces" id="faces"></div>
<p>시너지 타워의 정면과 보스의 여섯 면은 별도 에셋입니다. 보스는 기존 큐브 자세 계산과 연속 굴림을 사용합니다.</p>
<script src="preview-data.js"></script><script src="../cube-enemy-roll/trace.js"></script><script src="../cube-enemy-roll/geometry.js"></script>
<script>
const faces=['Front','Left','Right','Back','Top','Bottom'],labels=['정면','왼쪽','오른쪽','뒷면','정수리','아랫면'];
const gallery=document.querySelector('#gallery'),select=document.querySelector('#boss'),canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),slider=document.querySelector('#progress'),speed=document.querySelector('#speed');
const positions=[[110,410],[225,410],[225,295],[225,180],[225,65]];
const atlases={},tiles={};let ready=false,runId=0,activeSegment=1;
function load(path){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('이미지 로드 실패: '+path));image.src=path})}
for(const entry of synergyPreview.synergy){const card=document.createElement('div');card.className='card';const tile=document.createElement('div');tile.className='tile';for(const path of [entry.floor,entry.frame,entry.front]){const image=document.createElement('img');image.src=path;if(path===entry.front)image.style.clipPath="inset(6.25% round 3.125%)";tile.append(image)}const name=document.createElement('strong');name.textContent=entry.name;const note=document.createElement('small');note.textContent='정적 · '+entry.towerID;card.append(tile,name,note);gallery.append(card)}
for(const entry of synergyPreview.bosses){const option=document.createElement('option');option.value=entry.key;option.textContent=entry.name;select.append(option)}
const promises=synergyPreview.bosses.map(async entry=>{atlases[entry.key]=await load(entry.atlas);tiles[entry.key]=await load(entry.tile)});
function geometry(t){const u=Math.max(0,Math.min(1,t))*(cubeRollSamples.length-1),i=Math.floor(u),a=cubeRollSamples[i],b=cubeRollSamples[Math.min(i+1,cubeRollSamples.length-1)];return a.map((v,n)=>v+(b[n]-v)*(u-i))}
function clear(){ctx.clearRect(0,0,440,470);for(const [x,y] of positions)ctx.drawImage(tiles[select.value],x-50,y-50,100,100)}
function drawFace(pose,center,horizontal,width,shade=1){if(width<.0001)return;const index=faces.indexOf(pose.face);ctx.save();ctx.translate(...center);ctx.scale(horizontal?width:1,horizontal?1:width);ctx.rotate(-Math.PI*.5*pose.quarterTurns);ctx.beginPath();ctx.roundRect(-43,-43,86,86,86*8/224);ctx.clip();ctx.filter='brightness('+shade+')';ctx.drawImage(atlases[select.value],index%3*256+16,Math.floor(index/3)*256+16,224,224,-43,-43,86,86);ctx.restore()}
function settled(index){clear();drawFace(cubeRollPoses[index],positions[index],true,1);status.textContent=select.selectedOptions[0].textContent+' · '+labels[faces.indexOf(cubeRollPoses[index].face)];canvas.dataset.frame='settled-'+index}
function roll(index,t){const f=geometry(t),horizontal=index===1,axis=horizontal?[1,0]:[0,-1],start=positions[index-1],end=positions[index],center=start.map((v,i)=>v+(end[i]-v)*f[0]);clear();drawFace(cubeRollPoses[index-1],center.map((v,i)=>v+axis[i]*86*f[3]),horizontal,f[1],1-.1*f[2]);drawFace(cubeRollPoses[index],center.map((v,i)=>v+axis[i]*86*f[4]),horizontal,f[2],1-.1*f[1]);status.textContent=select.selectedOptions[0].textContent+' · '+Math.round(t*100)+'%';canvas.dataset.faces=String((f[1]>.0001?1:0)+(f[2]>.0001?1:0));canvas.dataset.boss=select.value}
function switchBoss(){runId++;slider.value=0;activeSegment=1;const list=document.querySelector('#faces');list.replaceChildren();const entry=synergyPreview.bosses.find(x=>x.key===select.value);for(let i=0;i<6;i++){const row=document.createElement('div'),image=document.createElement('img'),label=document.createElement('small');image.src='boss-faces/'+entry.key+'/'+faces[i]+'.png';label.textContent=labels[i];row.append(image,label);list.append(row)}if(ready)settled(0)}
async function play(){if(!ready)return;const id=++runId;settled(0);for(let n=1;n<positions.length&&id===runId;n++){activeSegment=n;const duration=1500/Math.max(.01,Number(speed.value)),start=performance.now();await new Promise(resolve=>{function frame(now){if(id!==runId){resolve();return}const t=Math.min(1,(now-start)/duration);slider.value=t;roll(n,t);if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(id!==runId)return;settled(n);await new Promise(r=>setTimeout(r,60))}}
select.onchange=switchBoss;speed.oninput=()=>document.querySelector('#speed-label').value=speed.value;slider.oninput=()=>{runId++;if(ready)roll(activeSegment,Number(slider.value))};document.querySelector('#play').onclick=play;document.querySelector('#reset').onclick=()=>{runId++;slider.value=0;activeSegment=1;if(ready)settled(0)};
Promise.all(promises).then(()=>{ready=true;const q=new URLSearchParams(location.search);if(q.has('boss')&&atlases[q.get('boss')])select.value=q.get('boss');switchBoss();if(q.has('p')){slider.value=q.get('p');roll(1,Number(slider.value))}document.body.dataset.previewReady='true';document.body.dataset.staticCharacterCount=String(synergyPreview.synergy.length);document.body.dataset.bossCount=String(synergyPreview.bosses.length)}).catch(e=>{status.textContent=e.message;document.body.dataset.previewError=e.message});
</script>
</html>
