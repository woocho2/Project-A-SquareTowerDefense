<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>큐브 적 · 모서리 굴림</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#19212c;color:#edf1f7;font:16px system-ui,sans-serif;padding:28px}h1{font-size:24px;margin:0 0 12px}p{color:#bdc9d5;max-width:780px}button,select{padding:10px 16px;border:0;border-radius:7px;font:inherit;margin-right:10px}button{background:#d9b451;color:#15202b;cursor:pointer}select{background:#31465a;color:inherit}.layout{display:flex;gap:32px;flex-wrap:wrap;margin-top:24px}.board{display:block;width:440px;height:470px;background:#223140;border-radius:12px}.status{width:350px}.pose{display:flex;align-items:center;gap:12px;border:1px solid #405363;border-radius:8px;padding:6px 12px;margin-bottom:9px}.pose img{width:62px;height:62px;object-fit:contain}.detail{color:#aebdcc;font-size:14px}#step{color:#f1d080;font-size:18px;min-height:48px;margin-bottom:12px}.selected{background:#31465a}.controls{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}input[type=range]{width:230px}.note{font-size:13px;color:#aebdcc;margin-top:22px}
img[src*='Front'],.pose img,.faces img{clip-path:inset(6.25% round 3.125%)}
</style>
<h1>모서리를 축으로 넘어가는 주사위</h1>
<p>이동과 굴림을 연속으로 표시하고 착지하면 잠깐 멈춥니다. 이동 속도를 낮추면 한 칸을 구르는 시간도 함께 늘어납니다.</p>
<button id="play">굴려 보기</button><button id="reset">처음으로</button>
<div id="equipment-options" style="display:flex;gap:12px;flex-wrap:wrap;margin:18px 0"></div>
<label>몬스터 색상 <select id="equipment"></select></label>
<div class="controls"><label>이동 속도 <input type="range" id="move-speed" min="0.25" max="5" step="0.25" value="1"> <output id="speed-value">1</output></label><span class="detail">낮을수록 느림 · 패스 한 칸 1.5 월드 단위 기준</span></div>
<p class="detail">검은 투구와 보석만 종류별 색상으로 변경합니다. 얼굴·눈·머리카락·금색 장식·보라색 날개는 원본을 유지합니다.</p>
<div class="controls"><label>굴림 구간 <select id="segment"><option value="1">오른쪽 1칸</option><option value="2">위쪽 첫 번째 칸</option><option value="3">위쪽 두 번째 칸</option><option value="4">위쪽 세 번째 칸</option></select></label><label>순간 보기 <input type="range" id="progress" min="0" max="1" step="0.01" value="0"></label></div>
<div class="layout"><canvas class="board" id="board" width="440" height="470"></canvas><div class="status"><div id="step">이미지를 불러오는 중…</div><div id="poses"></div></div></div>
<p class="note">게임의 C# 계산 결과를 사용한 미리보기입니다. 큐브 자세와 굴림 기하 데이터는 trace.js와 geometry.js에 있습니다.</p>
<script src="trace.js"></script><script src="geometry.js"></script>
<script src="face-sources.js"></script><script src="equipment-preview.js"></script>
<script>
const root='../synergy-cube-characters-v1/boss-faces/Valkyrie/';
const art={Front:root+'Front.png',Left:root+'Left.png',Right:root+'Right.png',Back:root+'Back.png',Top:root+'Top.png',Bottom:root+'Bottom.png'};
const labels={Front:'정면',Left:'왼쪽 옆모습',Right:'오른쪽 옆모습',Back:'뒷모습',Top:'정수리',Bottom:'아랫면'};
const content=Object.fromEntries(['Front','Left','Right','Back','Top','Bottom'].map(face=>[face,[16,16,224,224]]));
const positions=[[60,345],[175,345],[175,230],[175,115],[175,0]].map(([x,y])=>[x+50,y+65]);
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),step=document.querySelector('#step'),list=document.querySelector('#poses'),segment=document.querySelector('#segment'),slider=document.querySelector('#progress');
let images={};let runId=0,ready=false;
function load(path){return new Promise((resolve,reject)=>{let image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('이미지 로드 실패: '+path));image.src=path})}
const equipment=document.querySelector('#equipment');
equipmentPalettes.forEach(p=>{const option=document.createElement('option');option.value=p.key;option.textContent=p.label;equipment.append(option)});
let lastSettled=0;
function selectEquipment(key){equipment.value=key;images=coloredFaces[key];document.body.dataset.equipment=key;[...document.querySelector('#equipment-options').children].forEach(card=>card.style.outline=card.dataset.key===key?'2px solid #f1d080':'none');[...list.querySelectorAll('img')].forEach((picture,i)=>picture.src=images[cubeRollPoses[i].face].toDataURL());if(ready){runId++;if(canvas.dataset.frame?.startsWith('roll-'))inspect();else settled(lastSettled)}}
const loaded=prepareEquipmentFaces(load).then(()=>{equipmentPalettes.forEach(p=>{const card=document.createElement('button');card.dataset.key=p.key;card.style.cssText='display:flex;flex-direction:column;align-items:center;gap:5px;background:#263848;color:#edf1f7;margin:0;padding:8px 12px';const picture=document.createElement('img');picture.width=96;picture.height=96;picture.src=coloredFaces[p.key].Front.toDataURL();picture.style.clipPath="inset(6.25% round 3.125%)";card.append(picture,document.createTextNode(p.label));card.onclick=()=>selectEquipment(p.key);document.querySelector('#equipment-options').append(card)});const key=new URLSearchParams(location.search).get('type')||'SelfHeal';selectEquipment(coloredFaces[key]?key:'SelfHeal')});
equipment.onchange=()=>selectEquipment(equipment.value);
let tile;
const moveSpeed=document.querySelector('#move-speed'),speedValue=document.querySelector('#speed-value');
moveSpeed.oninput=()=>speedValue.value=moveSpeed.value;
function geometry(t){let u=Math.max(0,Math.min(1,t))*(cubeRollSamples.length-1),i=Math.floor(u),a=cubeRollSamples[i],b=cubeRollSamples[Math.min(i+1,cubeRollSamples.length-1)];return a.map((v,n)=>v+(b[n]-v)*(u-i))}
function clearBoard(){ctx.clearRect(0,0,canvas.width,canvas.height);positions.forEach(([x,y])=>ctx.drawImage(tile,x-50,y-50,100,100))}
function drawFace(pose,center,horizontal,width,shade=1){if(width<.0001)return;ctx.save();ctx.translate(center[0],center[1]);ctx.scale(horizontal?width:1,horizontal?1:width);ctx.rotate(-Math.PI*.5*pose.quarterTurns);ctx.beginPath();ctx.roundRect(-43,-43,86,86,86*8/224);ctx.clip();ctx.filter='brightness('+shade+')';const r=content[pose.face];ctx.drawImage(images[pose.face],r[0],r[1],r[2],r[3],-43,-43,86,86);ctx.restore()}
function mark(index,text){[...list.children].forEach((row,i)=>row.classList.toggle('selected',i===index));step.textContent=text}
function settled(index){lastSettled=index;clearBoard();drawFace(cubeRollPoses[index],positions[index],true,1);const p=cubeRollPoses[index];mark(index,labels[p.face]+' · '+['위','왼쪽','아래','오른쪽'][p.quarterTurns]+' 방향');canvas.dataset.frame='settled-'+index}
function roll(index,t){if(!ready)return;const f=geometry(t),horizontal=index===1,axis=horizontal?[1,0]:[0,-1],old=cubeRollPoses[index-1],next=cubeRollPoses[index],start=positions[index-1],end=positions[index],center=start.map((v,i)=>v+(end[i]-v)*f[0]);clearBoard();drawFace(old,center.map((v,i)=>v+axis[i]*86*f[3]),horizontal,f[1],1-.1*f[2]);drawFace(next,center.map((v,i)=>v+axis[i]*86*f[4]),horizontal,f[2],1-.1*f[1]);mark(t>=1?index:index-1,labels[old.face]+' → '+labels[next.face]+' · '+Math.round(t*100)+'%');canvas.dataset.frame='roll-'+index+'-'+t;canvas.dataset.faces=String((f[1]>.0001?1:0)+(f[2]>.0001?1:0));canvas.dataset.characterOnly='true'}
cubeRollPoses.forEach((p,i)=>{let row=document.createElement('div');row.className='pose';let picture=document.createElement('img');picture.src=art[p.face];picture.style.transform='rotate('+(-90*p.quarterTurns)+'deg)';row.append(picture);let text=document.createElement('div');text.innerHTML=(i===0?'출발':i===1?'오른쪽 1칸':'위쪽 '+(i-1)+'칸 누적')+'<div class="detail">'+labels[p.face]+' · '+['위','왼쪽','아래','오른쪽'][p.quarterTurns]+' 방향</div>';row.append(text);list.append(row)});
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function play(){if(!ready)return;let id=++runId;settled(0);await wait(150);for(let n=1;n<positions.length&&id===runId;n++){segment.value=n;let start=performance.now(),duration=1500/Math.max(.01,Number(moveSpeed.value));canvas.dataset.rollDuration=String(duration);await new Promise(resolve=>{function frame(now){if(id!==runId){resolve();return}let t=Math.min(1,(now-start)/duration);slider.value=t;roll(n,t);if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(id!==runId)return;settled(n);await wait(60)}}
function inspect(){runId++;roll(Number(segment.value),Number(slider.value))}
document.querySelector('#play').onclick=play;document.querySelector('#reset').onclick=()=>{runId++;slider.value=0;if(ready)settled(0)};segment.onchange=inspect;slider.oninput=inspect;
Promise.all([loaded,load('../realm-tile-layers/preview/Asgard-path.png')]).then(([,t])=>{tile=t;ready=true;document.body.dataset.previewReady='true';let q=new URLSearchParams(location.search);if(q.has('p')){segment.value=q.get('step')||1;slider.value=q.get('p');inspect()}else settled(0)}).catch(e=>{step.textContent=e.message;document.body.dataset.previewError=e.message});
</script>
</html>
